version: '3.8'

services:
  # Development environment
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/build
    ports:
      - "3000:3000"
      - "9229:9229"  # Debug port
    environment:
      - NODE_ENV=development
      - DEBUG=flash:*
      - TS_NODE_TRANSPILE_ONLY=true
    command: npm run dev
    depends_on:
      - redis
    stdin_open: true
    tty: true

  # Production-like environment
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Benchmarking environment
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=benchmark
    command: npm run benchmark
    depends_on:
      - app

volumes:
  redis_data: